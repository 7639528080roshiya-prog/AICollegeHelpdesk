<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Segoe UI;margin:0}
.box{background:#1e293b;padding:30px;border-radius:15px;width:320px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#0f172a;color:white;box-sizing:border-box}
button{width:100%;padding:12px;background:#38bdf8;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:16px}
a{color:#38bdf8;text-decoration:none;font-size:14px}
h2{text-align:center;color:#38bdf8}
</style>
</head>
<body>
<div class="box">
<h2>Register ✨</h2>
<form method="POST">
<input name="username" placeholder="Enter Email" required>
<input name="password" type="password" placeholder="Create Password" required>
<button>Register</button>
</form>
<p style="text-align:center;margin-top:15px"><a href="/login">Already have an account? Login</a></p>
</div>
</body>
</html>
