<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GCT Live Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#eef2ff,#f8fafc,#e0e7ff);
    min-height:100vh;
}


/* ================= TOP BAR ================= */

.top{
    background:linear-gradient(90deg,#0b3d91,#2563eb,#4f46e5);
    color:#fff;
    padding:13px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 12px rgba(0,0,0,0.15);
}

.top-title{
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
}

.top a{
    color:#fff;
    text-decoration:none;
    margin-left:8px;
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:800;
    letter-spacing:.5px;
    transition:.2s;
}

.top a:hover{
    background:rgba(255,255,255,0.18);
    transform:translateY(-1px);
}


/* ================= CHAT BOX ================= */

.box{
    max-width:820px;
    margin:22px auto;
    background:rgba(255,255,255,0.97);
    border-radius:18px;
    height:76vh;
    display:flex;
    flex-direction:column;
    box-shadow:0 10px 35px rgba(30,41,59,0.18);
    overflow:hidden;
    border:1px solid rgba(148,163,184,0.25);
}


/* ================= HEADER ================= */

.head{
    padding:19px 20px;
    border-bottom:1px solid #e5e7eb;
    background:linear-gradient(135deg,#ffffff,#f8fafc);
}

.head h3{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
    line-height:1.35;

    background:linear-gradient(
        90deg,
        #0b3d91,
        #2563eb,
        #7c3aed
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.online{
    font-size:13px;
    color:#15803d;
    margin-top:7px;
    font-weight:800;
    letter-spacing:1px;
}


/* ================= LANGUAGE ================= */

.language{
    padding:11px 16px;
    background:#f8fafc;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.language strong{
    font-size:14px;
    font-weight:900;
    letter-spacing:.8px;
    color:#334155;
}

.language select{
    padding:8px 14px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    outline:none;
    background:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.language select:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}


/* ================= MESSAGES ================= */

.msgs{
    flex:1;
    overflow-y:auto;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:13px;
    scroll-behavior:smooth;
}

.msgs::-webkit-scrollbar{
    width:7px;
}

.msgs::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:10px;
}

.msg{
    padding:12px 16px;
    border-radius:18px;
    max-width:75%;
    font-size:15px;
    line-height:1.65;
    white-space:pre-wrap;
    font-weight:600;
    letter-spacing:.35px;
    box-shadow:0 2px 8px rgba(15,23,42,.08);
}


/* ================= USER ================= */

.user{
    background:linear-gradient(
        135deg,
        #0b3d91,
        #2563eb
    );

    color:#fff;
    align-self:flex-end;
    border-bottom-right-radius:5px;
    font-weight:700;
}


/* ================= BOT ================= */

.bot{
    background:linear-gradient(
        135deg,
        #f1f5f9,
        #e2e8f0
    );

    color:#111827;
    align-self:flex-start;
    border-bottom-left-radius:5px;
}


/* ================= BOT ROW ================= */

.bot-row{
    display:flex;
    align-items:flex-end;
    align-self:flex-start;
    max-width:85%;
}

.bot-row .msg{
    align-self:flex-start;
}


/* ================= INPUT ================= */

.input{
    display:flex;
    gap:8px;
    padding:15px;
    border-top:1px solid #e5e7eb;

    background:linear-gradient(
        180deg,
        #ffffff,
        #f8fafc
    );
}

.input input{
    flex:1;
    padding:13px 18px;
    border-radius:28px;
    border:1px solid #d1d5db;
    outline:none;
    font-size:15px;
    font-weight:600;
    letter-spacing:.3px;
    transition:.2s;
}

.input input::placeholder{
    color:#94a3b8;
    font-weight:600;
}

.input input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}


/* ================= BUTTONS ================= */

.input button{
    padding:10px 17px;
    border:none;
    border-radius:22px;

    background:linear-gradient(
        135deg,
        #0b3d91,
        #2563eb
    );

    color:#fff;
    cursor:pointer;
    font-size:14px;
    font-weight:900;
    letter-spacing:.7px;
    transition:.2s;
}

.input button:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(37,99,235,.25);
}


/* ================= MICROPHONE ================= */

.mic-btn{
    background:linear-gradient(
        135deg,
        #dc2626,
        #b91c1c
    ) !important;

    font-size:18px !important;
    min-width:50px;
    border-radius:50% !important;
    padding:0 !important;
}

.mic-btn.listening{
    background:linear-gradient(
        135deg,
        #16a34a,
        #15803d
    ) !important;

    animation:pulse 1s infinite;

    box-shadow:0 0 0 5px rgba(22,163,74,.12);
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

    100%{
        transform:scale(1);
    }

}


/* ================= CLEAR ================= */

.clear-btn{
    background:linear-gradient(
        135deg,
        #64748b,
        #475569
    ) !important;
}


/* ================= UNIQUE TEXT ================= */

.unique-text{
    font-weight:900;
    letter-spacing:1px;

    background:linear-gradient(
        90deg,
        #2563eb,
        #7c3aed,
        #db2777
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .top{
        padding:10px 12px;
    }

    .top-title{
        font-size:12px;
        letter-spacing:.5px;
    }

    .top a{
        font-size:11px;
        margin-left:2px;
        padding:6px 7px;
    }

    .box{
        width:96%;
        margin:10px auto;
        height:84vh;
        border-radius:14px;
    }

    .head{
        padding:15px;
    }

    .head h3{
        font-size:19px;
    }

    .online{
        font-size:11px;
    }

    .language{
        padding:9px 12px;
    }

    .language strong{
        font-size:12px;
    }

    .language select{
        font-size:12px;
        padding:7px 9px;
    }

    .msgs{
        padding:14px;
    }

    .msg{
        max-width:86%;
        font-size:14px;
    }

    .bot-row{
        max-width:92%;
    }

    .input{
        flex-wrap:wrap;
        padding:10px;
    }

    .input input{
        width:100%;
        flex-basis:100%;
    }

    .mic-btn{
        min-width:45px;
        height:42px;
    }

}

</style>

</head>


<body>


<!-- ================= TOP BAR ================= -->

<div class="top">

    <span class="top-title">
        🤖 GCT Live Chat - Working!
    </span>

    <div>

        <a href="{{ url_for('home') }}">
            🏛️ Home
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</div>


<!-- ================= CHAT BOX ================= -->

<div class="box">


    <!-- HEADER -->

    <div class="head">

        <h3>
            ✨ Vanakkam
            <span class="unique-text">Guest!</span>
            Enna help venum? 👋
        </h3>

        <div class="online">
            🟢 AI College Helpdesk Online
        </div>

    </div>


    <!-- ================= LANGUAGE ================= -->

    <div class="language">

        <strong>
            🌐 Language:
        </strong>

        <select id="languageSelect">

            <option value="en">
                English
            </option>

            <option value="ta">
                தமிழ் (Tamil)
            </option>

        </select>

    </div>


    <!-- ================= MESSAGES ================= -->

    <div
        class="msgs"
        id="msgs">
    </div>


    <!-- ================= INPUT ================= -->

    <div class="input">

        <input
            id="inp"
            type="text"
            placeholder="Type your question..."
            autocomplete="off"
        >


        <!-- MICROPHONE -->

        <button
            class="mic-btn"
            id="micBtn"
            onclick="startVoice()"
            title="Voice Chat">

            🎤

        </button>


        <!-- SEND -->

        <button
            onclick="send()">

            Send

        </button>


        <!-- CLEAR -->

        <button
            class="clear-btn"
            onclick="clearChat()">

            Clear

        </button>

    </div>

</div>


<script>


// =====================================================
// VARIABLES
// =====================================================

const msgs =
    document.getElementById("msgs");

const inp =
    document.getElementById("inp");

const micBtn =
    document.getElementById("micBtn");

const languageSelect =
    document.getElementById("languageSelect");


// =====================================================
// LANGUAGE CHANGE
// =====================================================

languageSelect.addEventListener(
    "change",
    function(){

        const lang =
            languageSelect.value;


        if(lang === "ta"){

            inp.placeholder =
                "உங்கள் கேள்வியை கேட்கவும்...";

        }

        else{

            inp.placeholder =
                "Type your question...";

        }


        fetch(
            "/set_language",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    language:lang
                })
            }
        )

        .then(
            response =>
                response.json()
        )

        .then(
            data => {

                console.log(
                    "Language:",
                    data.language
                );

            }
        )

        .catch(
            error => {

                console.log(
                    "Language error:",
                    error
                );

            }
        );

    }
);


// =====================================================
// ADD MESSAGE
// =====================================================

function add(text,isUser){

    const d =
        document.createElement("div");


    d.className =
        isUser
        ? "msg user"
        : "msg bot";


    d.innerText =
        text;


    msgs.appendChild(d);


    msgs.scrollTop =
        msgs.scrollHeight;

}


// =====================================================
// SEND MESSAGE
// =====================================================

async function send(){

    const m =
        inp.value.trim();


    if(!m){

        return;

    }


    add(
        m,
        true
    );

    inp.value = "";


    try{

        const r =
            await fetch(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:m
                    })
                }
            );


        if(!r.ok){

            throw new Error(
                "Server error: " +
                r.status
            );

        }


        const j =
            await r.json();


        const reply =
            j.reply ||
            j.response ||
            "Sorry da! Response கிடைக்கவில்லை.";


        add(
            reply,
            false
        );

    }


    catch(error){

        console.error(error);

        add(
            "Sorry da! Server connection problem. Please try again.",
            false
        );

    }

}


// =====================================================
// ENTER KEY
// =====================================================

inp.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            send();

        }

    }
);


// =====================================================
// SPEECH RECOGNITION
// =====================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    // =================================================
    // START
    // =================================================

    recognition.onstart =
        function(){

            micBtn.classList.add(
                "listening"
            );

            micBtn.innerText =
                "🔴";

        };


    // =================================================
    // RESULT
    // =================================================

    recognition.onresult =
        function(event){

            const transcript =
                event.results[0][0]
                    .transcript;


            inp.value =
                transcript;


            setTimeout(
                function(){

                    send();

                },
                500
            );

        };


    // =================================================
    // ERROR
    // =================================================

    recognition.onerror =
        function(event){

            console.log(
                "Voice Error:",
                event.error
            );

        };


    // =================================================
    // END
    // =================================================

    recognition.onend =
        function(){

            micBtn.classList.remove(
                "listening"
            );

            micBtn.innerText =
                "🎤";

        };

}


// =====================================================
// START VOICE
// =====================================================

function startVoice(){

    if(!recognition){

        alert(
            "Voice Recognition support illa.\n\nGoogle Chrome browser use pannunga."
        );

        return;

    }


    const lang =
        languageSelect.value;


    if(lang === "ta"){

        recognition.lang =
            "ta-IN";

    }

    else{

        recognition.lang =
            "en-IN";

    }


    try{

        recognition.start();

    }

    catch(error){

        console.log(error);

    }

}


// =====================================================
// CLEAR CHAT
// =====================================================

function clearChat(){

    msgs.innerHTML =
        "";

}


// =====================================================
// INITIAL LANGUAGE
// =====================================================

languageSelect.value =
    "en";


</script>


</body>

</html>
