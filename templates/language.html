<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Segoe UI;margin:0}
.box{background:#1e293b;padding:35px;border-radius:20px;width:350px;text-align:center}
button{width:100%;padding:15px;margin:10px 0;border-radius:12px;border:none;font-weight:bold;cursor:pointer;font-size:16px;transition:0.3s}
.en{background:#38bdf8;color:black}
.ta{background:#22c55e;color:black}
button:hover{transform:scale(1.03)}
h2{color:white;margin-bottom:10px}
p{color:#94a3b8;margin-bottom:20px}
</style>
</head>
<body>
<div class="box">
<h2>🌐 Select Language</h2>
<p>Choose your preferred language</p>
<form method="POST">
<button name="lang" value="en" class="en">🇬🇧 English</button>
<button name="lang" value="ta" class="ta">🇮🇳 Tamil / Tanglish</button>
</form>
</div>
</body>
</html>
