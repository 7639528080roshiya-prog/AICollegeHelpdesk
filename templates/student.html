<!DOCTYPE html>
<html>
<head>
<title>Student - Result</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.btn{padding:12px 25px;border:none;border-radius:8px;color:white;cursor:pointer}
.green{background:#4CAF50} .blue{background:#2196F3} .red{background:#d32f2f}
.top{background:#4CAF50;color:white;padding:12px 20px;border-radius:10px;text-align:center}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin:10px 0}
</style>
<script>
function checkResult(){
 let roll = document.getElementById('roll').value.trim();
 if(!roll){ alert("Roll No Enter Pannu"); return; }
 fetch('/get_result',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'roll='+roll})
 .then(r=>r.json()).then(d=>{
  let div = document.getElementById('resultDiv');
  if(d.found){
   div.innerHTML = `<div style="background:#e8f5e9;padding:15px;border-radius:10px;border-left:5px solid #4CAF50">
   <h3>Result Found ✅</h3>
   <p><b>Roll No:</b> ${d.roll}</p>
   <p><b>Name:</b> ${d.student?d.student.name:'N/A'}</p>
   <p><b>Dept:</b> ${d.data.dept}</p>
   <p><b>CGPA:</b> ${d.data.cgpa}</p>
   <p><b>Result:</b> <span style="color:green;font-weight:bold">${d.data.result}</span></p>
   </div>`;
  } else {
   div.innerHTML = `<div style="background:#ffebee;padding:15px;border-radius:10px;color:red"><b>Result Not Found - Roll No Check Pannu</b></div>`;
  }
 });
}
</script>
</head>
<body>

<div class="top">
<h2>🎓 Exam Result Check</h2>
</div>

<div style="text-align:center;margin:15px">
<a href="/"><button class="btn blue">🏠 Home</button></a>
</div>

<div class="card">
<h3>📝 Exam Result Check</h3>
<input id="roll" placeholder="Enter Roll No - Ex: 21CSE01">
<button class="btn green" onclick="checkResult()">Check Result</button>
<div id="resultDiv" style="margin-top:15px"></div>
</div>

<div class="card">
<h3>ℹ️ Info</h3>
<p><b>Admission:</b> {{staff_data['admission']}}</p>
<p><b>Naan Mudhalvan:</b> {{staff_data['naan_mudhalvan']}}</p>
<p><b>Exam Fees:</b> {{staff_data['exam_fees']}}</p>
</div>

</body>
</html>
